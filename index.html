<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Mirror</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0c2b">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mirror">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,700&family=Noto+Serif+JP:wght@500&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#07061a; --night2:#0e0c2b; --indigo:#2b20b8; --indigo2:#1c1580; --violet:#5a48ff;
  --lav:#8f86ff; --gold:#e7c44a; --gold2:#c9a52c; --paper:#f7f6ff; --ink:#15123d; --ink2:#4a4775;
  --slate:#6b7393; --red:#e0475b; --green:#2fb36d; --line:#d9d6f5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Montserrat,system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:
    radial-gradient(1200px 600px at 80% -10%, #2a1f9e55, transparent 60%),
    radial-gradient(900px 500px at -10% 40%, #3b2bd033, transparent 60%),
    linear-gradient(180deg,var(--night) 0%, var(--night2) 100%);
  background-attachment:fixed;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 72% 8%,#fff6,transparent),
  radial-gradient(1px 1px at 40% 60%,#fff5,transparent),radial-gradient(1.5px 1.5px at 88% 52%,#fff7,transparent),
  radial-gradient(1px 1px at 22% 84%,#fff5,transparent),radial-gradient(1px 1px at 60% 92%,#fff6,transparent);}
.app{max-width:540px;margin:0 auto;padding:0 14px 110px;position:relative}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 10px;color:#fff}
.brand{display:flex;align-items:center;gap:10px}
.brand .kanji{font-family:"Noto Serif JP",serif;font-size:26px;color:var(--gold);line-height:1}
.brand .name{font-weight:900;letter-spacing:.18em;font-size:14px}
.brand .sub{font-size:10px;letter-spacing:.32em;color:var(--lav);margin-top:3px}
.sync{font-size:10.5px;color:#b9b4ff;text-align:right;max-width:46%}
.sync b{color:var(--gold)}

/* section banner */
.banner{background:linear-gradient(180deg,var(--indigo),var(--indigo2));color:#fff;text-align:center;border-radius:18px;
  padding:14px 10px;margin:16px 0 12px;font-weight:900;letter-spacing:.06em;font-size:17px;box-shadow:0 8px 30px #2b20b855;border:1px solid #ffffff1a}

/* paper card */
.paper{background:var(--paper);border-radius:16px;padding:20px 18px 18px 30px;margin:12px 0;position:relative;
  box-shadow:0 14px 40px #0008, inset 0 0 0 1px #fff;overflow:hidden}
.paper:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(500px 300px at 110% -10%, #5a48ff12, transparent 60%)}
.paper .vert{position:absolute;left:9px;top:18px;writing-mode:vertical-rl;font-family:"Noto Serif JP",serif;font-size:13px;color:var(--indigo);letter-spacing:.25em}
.paper .vert.r{left:auto;right:8px;top:auto;bottom:16px}
.label{display:flex;align-items:center;gap:10px;color:var(--indigo);font-size:9.5px;letter-spacing:.42em;font-weight:600;margin-bottom:6px}
.label:before,.label:after{content:"";height:1px;background:var(--indigo);opacity:.55;flex:1}
.spark{width:18px;height:18px;fill:var(--indigo);flex:none}
.title{font-weight:900;color:var(--indigo);font-size:26px;letter-spacing:-.01em;text-transform:uppercase;margin:4px 0 8px;line-height:1.05}
.title.sm{font-size:19px}
.lead{font-style:italic;font-size:14px;line-height:1.55;color:var(--ink)}
.lead b{font-style:italic;font-weight:800}
.muted{color:var(--ink2);font-size:12.5px;line-height:1.5}
.knot{display:flex;align-items:center;gap:10px;margin-top:14px;opacity:.7}
.knot:before,.knot:after{content:"";height:1px;background:var(--indigo);flex:1}

/* stat row */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:linear-gradient(180deg,#221a8f,#15106a);color:#fff;border-radius:14px;padding:10px 8px;text-align:center;border:1px solid #ffffff14}
.stat .v{font-family:Oswald,sans-serif;font-size:20px;font-weight:600}
.stat .k{font-size:9px;letter-spacing:.14em;color:#c5c0ff;text-transform:uppercase;margin-top:2px}
.stat .v.up{color:#ff8b98}.stat .v.down{color:#7fe3aa}

/* pill bars (like lesson bars) */
.pill{display:flex;gap:10px;align-items:stretch;margin:8px 0}
.pill .n{width:34px;border-radius:10px;background:#8e95ad;color:#fff;font-family:Oswald;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.pill .b{flex:1;border-radius:12px;padding:9px 12px;color:#fff;font-size:12.5px;line-height:1.4}
.pill .b b{font-weight:800}
.c1{background:var(--violet)}.c2{background:#6f7591}.c3{background:var(--gold);color:var(--ink)!important}.c4{background:#0d0b22}
.c5{background:#3f4fd6}.c6{background:#1c1a5c}.c7{background:#7b5cff}

/* verdict */
.verdict{border-radius:14px;padding:14px;color:#fff;margin-top:10px}
.verdict h3{margin:0 0 4px;font-size:15px;font-weight:900;letter-spacing:.02em;text-transform:uppercase}
.verdict p{margin:0;font-size:13px;line-height:1.5}
.v-good{background:linear-gradient(135deg,#1f8f5a,#2fb36d)}
.v-wait{background:linear-gradient(135deg,#a7871a,var(--gold));color:var(--ink)}
.v-warn{background:linear-gradient(135deg,#a82d40,var(--red))}
.v-info{background:linear-gradient(135deg,var(--indigo2),var(--violet))}

/* form */
.field{margin:14px 0}
.field > .fl{font-size:10px;letter-spacing:.3em;font-weight:700;color:var(--indigo);text-transform:uppercase;margin-bottom:7px;display:block}
input[type=number],input[type=text],input[type=date],select,textarea{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--violet)}
textarea{min-height:64px;resize:vertical;font-size:14px}
.weightbox{display:flex;align-items:center;gap:8px}
.weightbox input{font-family:Oswald;font-size:30px;font-weight:600;text-align:center;padding:8px}
.weightbox .u{font-weight:800;color:var(--indigo)}
.stepbtn{width:46px;height:52px;border-radius:12px;border:none;background:#ece9ff;color:var(--indigo);font-size:22px;font-weight:800}

.photo{border:2px dashed #b8b2f5;border-radius:16px;min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;
  gap:6px;color:var(--indigo);background:#efedff;cursor:pointer;position:relative;overflow:hidden;text-align:center}
.photo img{width:100%;max-height:420px;object-fit:cover;display:block}
.photo .ph-ic{font-size:34px}
.photo .ph-t{font-weight:800;font-size:14px}
.photo .ph-s{font-size:11.5px;color:var(--ink2);padding:0 18px}
.photo .retake{position:absolute;right:10px;bottom:10px;background:#000a;color:#fff;font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px}
.photo.busy:after{content:"Processing…";position:absolute;inset:0;background:#fffc;display:flex;align-items:center;justify-content:center;font-weight:800}
input[type=file]{display:none}

.sig{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;margin:6px 0}
.sig .nm{font-size:13px;font-weight:700}
.seg{display:flex;background:#ece9ff;border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;font:inherit;font-size:12px;font-weight:700;color:var(--ink2);padding:7px 10px;border-radius:8px;min-width:46px}
.seg button.on.g{background:var(--green);color:#fff}
.seg button.on.n{background:#6f7591;color:#fff}
.seg button.on.b{background:var(--red);color:#fff}
.sigscore{font-size:12px;font-weight:800;margin-top:6px}

.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#fff;border:1.5px solid var(--line);margin:6px 0;cursor:pointer}
.check .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--violet);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px}
.check.on{border-color:var(--violet);background:#f0eeff}
.check.on .bx{background:var(--violet)}
.check .ct{font-size:13.5px;font-weight:700}
.check .cd{font-size:11.5px;color:var(--ink2);margin-top:2px}
.check.dis{opacity:.45}

.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font:inherit;font-weight:900;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.gold{background:linear-gradient(180deg,#f2d461,var(--gold2));color:var(--ink);box-shadow:0 8px 24px #e7c44a40}
.btn.ind{background:linear-gradient(180deg,var(--violet),var(--indigo));color:#fff}
.btn.ghost{background:#ece9ff;color:var(--indigo)}
.btn.red{background:#fde6e9;color:var(--red)}
.btn + .btn{margin-top:8px}
.row{display:flex;gap:8px}.row > *{flex:1}

.datebar{display:flex;align-items:center;justify-content:space-between;color:#fff;margin:6px 0 2px}
.datebar button{background:#ffffff14;border:1px solid #ffffff22;color:#fff;width:42px;height:42px;border-radius:12px;font-size:18px}
.datebar button:disabled{opacity:.3}
.datebar .d{text-align:center}
.datebar .d1{font-weight:900;font-size:16px;letter-spacing:.04em}
.datebar .d2{font-size:11px;color:var(--lav);letter-spacing:.2em;text-transform:uppercase;margin-top:2px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:12px;font-weight:700;color:var(--ink2)}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal .g{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:#e6e3ff}
.gal .g img{width:100%;height:100%;object-fit:cover;display:block}
.gal .g span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#000b);color:#fff;font-size:10px;font-weight:700;padding:14px 6px 5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cmp .side{text-align:center}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#e6e3ff;display:block}
.cmp .cap{font-size:11.5px;font-weight:700;margin-top:5px}

table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--indigo);padding:7px 6px;text-align:left}
table.t th:first-child{border-radius:8px 0 0 8px}table.t th:last-child{border-radius:0 8px 8px 0}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td.num{font-family:Oswald;font-weight:500;text-align:right}
table.t th.num{text-align:right}
td .mp{display:inline-block;min-width:24px;text-align:center;border-radius:5px;padding:1px 4px;font-family:Oswald;font-size:12px}
.mp.p{background:#3f4fd6;color:#fff}.mp.c{background:var(--gold);color:var(--ink)}.mp.f{background:#6f7591;color:#fff}
tr.food{cursor:pointer}
tr.food.sel td{background:#f0eeff}
.fnote{font-size:11px;color:var(--ink2)}
.calc{background:#fff;border:1.5px solid var(--violet);border-radius:14px;padding:12px;margin:10px 0}
.calc .res{display:flex;gap:6px;margin-top:10px}
.calc .res div{flex:1;text-align:center;border-radius:10px;padding:8px 4px;color:#fff;font-family:Oswald;font-size:18px}
.calc .res small{display:block;font-family:Montserrat;font-size:9px;letter-spacing:.12em;opacity:.85}

.timeline{display:flex;gap:4px;margin:10px 0}
.timeline div{flex:1;height:8px;border-radius:4px;background:#dcd8ff}
.timeline div.on{background:var(--violet)}
.timeline div.now{background:var(--gold)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,#07061aee 30%)}
nav.tabs .in{display:flex;gap:4px;background:linear-gradient(180deg,#2b20b8,#1c1580);border-radius:20px;padding:6px;width:100%;max-width:520px;border:1px solid #ffffff22;box-shadow:0 10px 30px #000a}
nav.tabs button{flex:1;border:none;background:transparent;color:#bdb7ff;font:inherit;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:8px 2px 6px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{background:#ffffff1c;color:var(--gold)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--ink);font-weight:800;font-size:13px;
  padding:11px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:50;pointer-events:none;box-shadow:0 8px 24px #0008;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.viewer{position:fixed;inset:0;background:#000e;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.viewer.show{display:flex}
.viewer img{max-width:100%;max-height:80vh;border-radius:12px}
.viewer .vc{color:#fff;font-weight:700;margin-top:10px;font-size:13px}
.hide{display:none!important}

/* ===== train ===== */
.exrow.light{background:#f7f7fb}
.seg2{overflow-x:auto;scrollbar-width:none}
.seg2 button{flex:1 0 auto;padding:9px 9px;font-size:10.5px}
.restbox{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#1c1580,#2b20b8);color:#fff;border-radius:14px;padding:12px;margin:10px 0}
.restbox .rb-l{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#c5c0ff;font-weight:700}
.restbox .rb-t{font-family:Oswald;font-size:40px;font-weight:600;line-height:1.05}
.restbox .rb-t.due{color:var(--gold)}
.restbox .rb-a{flex:1;min-width:0}
.restbox .chip{padding:5px 8px;font-size:11px;background:#ffffff14;border-color:#ffffff2a;color:#fff}
.restbox .chip.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.lift{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.lf-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lf-h b{font-size:15px;font-weight:900}
.lf-h span{font-family:Oswald;font-size:13px;color:var(--ink2)}
table.lt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.lt th{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:3px 4px;border-bottom:1px solid var(--line)}
table.lt td{padding:6px 4px;border-bottom:1px solid #eeecfb}
table.lt .num{text-align:right;font-family:Oswald}
table.lt tr.wu td{color:var(--ink2)}
.ldel{border:none;background:transparent;color:var(--red);font-weight:900;font-size:15px}
.lstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lstat div{background:#f0eeff;border-radius:10px;padding:8px 10px}
.lstat small{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.lstat b{font-family:Oswald;font-size:17px;font-weight:600;color:var(--indigo)}

.seg2{display:flex;gap:4px;background:#ffffff12;border:1px solid #ffffff1c;border-radius:14px;padding:4px;margin:0 0 8px}
.seg2 button{flex:1;border:none;background:transparent;color:#c5c0ff;font:inherit;font-size:11px;font-weight:800;letter-spacing:.06em;padding:9px 2px;border-radius:10px}
.seg2 button.on{background:var(--gold);color:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;border:none;border-radius:14px;padding:14px 12px;text-align:left;color:#fff;font:inherit;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px}
.tile b{font-size:14px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.tile small{font-size:11px;opacity:.8}
.tile .tb{position:absolute;top:8px;right:8px;background:#fff;color:var(--indigo);border-radius:999px;font-size:10px;font-weight:800;padding:2px 7px}
.back{border:none;background:#ece9ff;color:var(--indigo);font:inherit;font-weight:800;font-size:12px;border-radius:999px;padding:7px 12px;margin-bottom:4px}
.exrow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer}
.exrow.cur{border-color:var(--gold);background:#fffbea}
.er-m{flex:1;min-width:0}
.er-n{font-size:14px;font-weight:800}
.er-s{font-size:11.5px;color:var(--ink2);margin-top:3px}
.er-c{background:var(--indigo);color:#fff;font-family:Oswald;font-size:16px;min-width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.er-p{color:var(--violet);font-size:20px;font-weight:900;flex:none;width:24px;text-align:center}
.sk{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.sk-h{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.ladder{display:flex;gap:4px;margin-top:10px}
.ladder i{flex:1;height:8px;border-radius:4px;background:#e3e0fb}
.ladder i.done{background:var(--violet)}
.ladder i.now{background:var(--gold)}
.witem{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.wi-m{flex:1;min-width:0}
.wi-m input{margin-top:6px;padding:7px 9px;font-size:13px}
.wi-b{display:flex;flex-direction:column;gap:3px}
.wi-b button{border:none;background:#ece9ff;color:var(--indigo);width:30px;height:24px;border-radius:7px;font-weight:900}

.gx{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.gx-h{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.gx-n{font-weight:900;font-size:15px;color:var(--ink)}
.gx-m{font-size:11.5px;color:var(--ink2);margin-top:4px}
.gx-sum{text-align:center;background:var(--indigo);color:#fff;border-radius:12px;padding:6px 10px;min-width:58px}
.gx-sum b{font-family:Oswald;font-size:20px;display:block;line-height:1.1}
.gx-sum span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.gx-sets{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.gs{display:inline-flex;align-items:center;gap:5px;background:#ece9ff;border-radius:9px;padding:4px 4px 4px 9px;font-family:Oswald;font-size:15px;color:var(--indigo)}
.gs small{font-family:Montserrat;font-size:9.5px;color:var(--ink2)}
.gs button{border:none;background:transparent;color:var(--red);font-weight:900;font-size:14px;padding:0 4px}
.gs.tot{background:var(--gold);color:var(--ink);padding-right:9px}
.timer{font-family:Oswald;font-size:72px;font-weight:600;text-align:center;color:var(--indigo);margin:8px 0 10px;letter-spacing:.02em}
/* ===== fuel ===== */
.plan{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.plan.used{border-color:var(--violet);background:#f4f2ff}
.pl-h{display:flex;justify-content:space-between;align-items:baseline}
.pl-h b{font-size:16px;font-weight:900;color:var(--indigo)}
.pl-h span{font-family:Oswald;font-size:20px;font-weight:600}
.pl-m{display:flex;gap:6px;margin:8px 0 6px}

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO = () => iso(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const fmtDate = (s,opt) => parse(s).toLocaleDateString('en-GB', opt || {weekday:'short', day:'numeric', month:'short'});
const r1 = x => (Math.round(x*10)/10).toFixed(1);
const clone = o => JSON.parse(JSON.stringify(o));
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2200); }

/* ============ state & storage ============ */
let profile = null;            // {startDate, goal, actions:[], actionsSince, custom:[], log:[]}
let days = {};                 // date -> entry
let mode = 'local';            // 'local' | 'db'
let col = null, assets = null;
let tab = 'today', viewDate = todayISO(), draft = null, dirty = false;
let picks = null, foodCat = 'Carbs', foodQ = '', foodSel = null, grams = 100, range = 30, cmpA = null, cmpB = null;
let onboardGoal = 'cut', confirmReset = false, migrated = false;
let foodDays = {};            // date -> {date, items:[]}
let gtgDays = {};

function loadLocal(){
  try { const o = JSON.parse(localStorage.getItem('mm_v1') || 'null'); if(o){ profile=o.profile||null; days=o.days||{}; foodDays=o.food||{}; gtgDays=o.gtg||{}; tDays=o.t||{}; } } catch(e){}
}
function saveLocal(){
  if(mode!=='local') return;
  try { localStorage.setItem('mm_v1', JSON.stringify({profile, days, food:foodDays, gtg:gtgDays, t:tDays})); }
  catch(e){ toast('Device storage is full'); }
}
const chains = {};
function writeDoc(id, data){
  if(mode!=='db'){ saveLocal(); return Promise.resolve(); }
  chains[id] = (chains[id]||Promise.resolve()).then(()=>col.doc(id).set(data)).catch(e=>{
    if(e && e.code==='unavailable') return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(()=>col.doc(id).set(data));
    throw e;
  }).catch(e=>{ toast(e && e.code==='quota_exceeded' ? 'Storage full: delete old photos' : 'Could not save, try again'); });
  return chains[id];
}
const saveProfile = () => writeDoc('profile', profile);
const saveDay = rec => writeDoc('d-'+rec.date, rec);
function setSync(html){ $('#sync').innerHTML = html; }

const FB_V = '12.18.0';
let fb = null, uid = null, unsub = null;
async function connect(){
  if(!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('PASTE')){ setSync('Saved on this device<br><small>Firebase not set up yet</small>'); return; }
  try{
    const V = FB_V;
    const app = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const auth = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const a = app.initializeApp(firebaseConfig);
    const db = fs.initializeFirestore(a, {localCache: fs.persistentLocalCache()});
    const au = auth.getAuth(a);
    fb = {auth, fs, db, au, app:a};
    if(firebaseConfig.appCheckSiteKey){
      try{ const ac = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app-check.js`);
        ac.initializeAppCheck(a, {provider: new ac.ReCaptchaEnterpriseProvider(firebaseConfig.appCheckSiteKey), isTokenAutoRefreshEnabled:true}); }catch(e){}
    }
    const btn = $('#authBtn'); btn.classList.remove('hide');
    btn.onclick = async ()=>{
      if(uid){ await auth.signOut(au); return; }
      const prov = new auth.GoogleAuthProvider();
      try{ await auth.signInWithPopup(au, prov); }
      catch(e){ if(e && e.code==='auth/popup-blocked') auth.signInWithRedirect(au, prov); else toast('Sign-in failed'); }
    };
    auth.getRedirectResult(au).catch(()=>{});
    auth.onAuthStateChanged(au, user=>{
      if(unsub){ unsub(); unsub=null; }
      if(!user){
        uid=null; push=null; ntDraft=null; mode='local'; col=null; loadLocal();
        btn.textContent='Sign in with Google'; setSync('Not signed in<br><small>saved on this device only</small>'); render(); return;
      }
      uid=user.uid; btn.textContent='Sign out';
      subscribe(); loadPush();
    });
  }catch(e){ setSync('Saved on this device<br><small>cloud unavailable</small>'); }
}
function subscribe(){
  const {fs, db} = fb;
  const hadLocal = !!profile || Object.keys(days).length>0 || Object.keys(foodDays).length>0 || Object.keys(gtgDays).length>0 || Object.keys(tDays).length>0;
  const local = {profile: clone(profile), days: clone(days), food: clone(foodDays), gtg: clone(gtgDays), t: clone(tDays)};
  const ref = fs.collection(db, 'users', uid, 'entries');
  col = { doc: id => ({
    set: data => fs.setDoc(fs.doc(ref, id), JSON.parse(JSON.stringify(data))),
    delete: () => fs.deleteDoc(fs.doc(ref, id))
  })};
  mode='db'; setSync('Syncing…');
  const timer = setTimeout(()=>setSync('Offline<br><small>showing last copy</small>'), 10000);
  unsub = fs.onSnapshot(ref, {includeMetadataChanges:true}, snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(timer); setSync('<b>●</b> Synced · private'); }
    if(!snap.metadata.fromCache && snap.empty && hadLocal && !migrated){
      migrated=true; profile=local.profile; days=local.days; foodDays=local.food||{}; gtgDays=local.gtg||{}; tDays=local.t||{};
      if(profile) saveProfile(); Object.values(days).forEach(saveDay); Object.keys(foodDays).forEach(saveFood); Object.keys(gtgDays).forEach(saveGtg); Object.keys(tDays).forEach(saveT); render(); return;
    }
    let np=null; const d={}, fd={}, gd={}, td={};
    snap.docs.forEach(doc=>{ const v=doc.data(); if(doc.id==='profile') np=v; else if(doc.id.startsWith('d-') && v.date) d[v.date]=v; else if(doc.id.startsWith('f-') && v.date) fd[v.date]=v; else if(doc.id.startsWith('g-') && v.date) gd[v.date]=v; else if(doc.id.startsWith('t-') && v.date) td[v.date]=v; });
    profile=np; days=d; foodDays=fd; gtgDays=gd; tDays=td; render(true);
  }, err=>{ clearTimeout(timer); setSync('Sync error<br><small>'+esc(err.code||'')+'</small>'); });
}

/* ============ analysis ============ */
function weighins(upTo){
  return Object.values(days).filter(e=>e.weight && !e.excused && e.date<=upTo).sort((a,b)=>a.date<b.date?-1:1);
}
function avg5(at){
  const list = weighins(at).filter(e=>diffDays(e.date,at)<10).slice(-5);
  if(list.length<3) return null;
  return list.reduce((s,e)=>s+e.weight,0)/list.length;
}
function sigScore(e){
  if(!e || !e.signals) return null;
  let s=0, n=0;
  SIGNALS.forEach(g=>{ const v=e.signals[g.k]; if(v===undefined||v===null) return; n++; s += g.good==='high' ? v : -v; });
  return n ? s : null;
}
function recentSig(at){
  const list = Object.values(days).filter(e=>e.date<=at && diffDays(e.date,at)<7).map(sigScore).filter(v=>v!==null);
  if(list.length<3) return null;
  return list.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,list.length);
}
function actionList(){ return ACTIONS.concat((profile&&profile.custom)||[]); }
function analyze(){
  const t = todayISO();
  if(!profile) return null;
  const n = diffDays(profile.startDate, t) + 1;
  const a = avg5(t), b = avg5(addDays(t,-7));
  const count = weighins(t).length;
  const wk = (a!==null && b!==null && count>=8) ? a-b : null;
  const pct = wk!==null ? wk/b*100 : null;
  const rs = recentSig(t);
  const dsc = profile.actionsSince ? diffDays(profile.actionsSince, t) : null;
  const goal = profile.goal;
  let v;
  if(n<=7) v = {tone:'info', h:`Setup week · Day ${Math.max(n,1)}/7`, p:'Change nothing yet. Weigh in every morning after the bathroom, before eating or drinking, and take your photo in the same spot and light. This week shows your real starting point.'};
  else if(!profile.actions || !profile.actions.length) v = {tone:'info', h:'Day 8: choose your actions', p:'Your baseline is in. Pick 2 actions (3 max) in the Plan tab. Small and sustainable beats brutal.', go:'plan'};
  else if(rs!==null && rs<=-2.5) v = {tone:'warn', h:'Health comes first', p:'Your signals have been low for several days. Pause the deficit, eat at maintenance for a few days and put sleep first. If it keeps going, talk to a doctor.'};
  else if(pct===null) v = {tone:'info', h:'Collecting data', p:'The trend needs about 10 weigh-ins over 2 weeks. Keep logging every morning.'};
  else if(goal==='cut'){
    if(pct < -1.0) v = {tone:'warn', h:'Losing too fast', p:`${r1(pct)}% of bodyweight per week. Faster than about 1% costs muscle and energy. Add back roughly 150 kcal a day, ideally carbs around training.`};
    else if(pct <= -0.25) v = {tone:'good', h:'On track', p:`${r1(wk)} kg/week (${r1(pct)}%). Keep everything exactly as it is.`};
    else if(rs!==null && rs<=-1) v = {tone:'wait', h:'Stuck and tired? Likely water', p:'A flat scale with low energy is usually water retention, not a real plateau. Don\'t cut more. One or two days at maintenance with more carbs often unlocks it.'};
    else if(dsc!==null && dsc<21) v = {tone:'wait', h:`Wait ${21-dsc} more day${21-dsc===1?'':'s'}`, p:`The trend is flat, but your actions are only ${dsc} days old. Give the system 3 weeks before changing it.`};
    else v = {tone:'info', h:'Review unlocked', p:'3+ weeks with a flat trend and good signals. Add one action and keep the existing ones.', go:'plan'};
  } else if(goal==='maintain'){
    if(Math.abs(pct)<=0.3) v = {tone:'good', h:'Stable', p:`${r1(wk)} kg/week. Maintenance is working.`};
    else v = {tone:'info', h: pct>0?'Drifting up':'Drifting down', p:`${r1(wk)} kg/week. Adjust by about 100 to 150 kcal a day ${pct>0?'less':'more'}.`};
  } else {
    if(pct > 0.5) v = {tone:'warn', h:'Gaining too fast', p:`${r1(pct)}% per week. Most of the extra is fat. Pull back about 150 kcal a day.`};
    else if(pct >= 0.1) v = {tone:'good', h:'On track', p:`+${r1(wk)} kg/week. Slow and lean.`};
    else if(dsc!==null && dsc<21) v = {tone:'wait', h:`Wait ${21-dsc} more days`, p:'No gain yet. Give it 3 weeks before changing.'};
    else v = {tone:'info', h:'Review unlocked', p:'Weight is flat after 3 weeks. Add about 150 kcal a day.'};
  }
  return {n, a, wk, pct, rs, dsc, v, count};
}

function chartSVG(){
  const t = todayISO();
  const startR = range==='all' ? (profile?profile.startDate:addDays(t,-30)) : addDays(t,-range+1);
  const pts = Object.values(days).filter(e=>e.weight && e.date>=startR && e.date<=t).sort((a,b)=>a.date<b.date?-1:1);
  if(pts.length<2) return `<div class="empty">Log at least 2 mornings to see your chart.</div>`;
  const span = Math.max(1, diffDays(startR, t));
  const avgs = [];
  for(let i=0;i<=span;i++){ const d=addDays(startR,i); const a=avg5(d); if(a!==null && weighins(d).length) avgs.push([d,a]); }
  const all = pts.map(p=>p.weight).concat(avgs.map(a=>a[1]));
  let lo = Math.min(...all), hi = Math.max(...all); if(hi-lo<1){ const m=(hi+lo)/2; lo=m-0.5; hi=m+0.5; }
  lo -= 0.3; hi += 0.3;
  const W=340,H=190,L=34,R=8,T=10,B=24;
  const x = d => L + (diffDays(startR,d)/span)*(W-L-R);
  const y = w => T + (1-(w-lo)/(hi-lo))*(H-T-B);
  let g = '';
  for(let i=0;i<=4;i++){ const w = lo + (hi-lo)*i/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(w)}" y2="${y(w)}" stroke="#e1defa"/><text x="${L-5}" y="${y(w)+3}" font-size="9" text-anchor="end" fill="#6b6894" font-family="Oswald">${r1(w)}</text>`; }
  g += `<text x="${L}" y="${H-6}" font-size="9" fill="#6b6894">${esc(fmtDate(startR,{day:'numeric',month:'short'}))}</text><text x="${W-R}" y="${H-6}" font-size="9" text-anchor="end" fill="#6b6894">${esc(fmtDate(t,{day:'numeric',month:'short'}))}</text>`;
  const line = avgs.map(a=>`${x(a[0]).toFixed(1)},${y(a[1]).toFixed(1)}`).join(' ');
  const dots = pts.map(p=>`<circle cx="${x(p.date).toFixed(1)}" cy="${y(p.weight).toFixed(1)}" r="3" fill="${p.excused?'#fff':'#8f86ff'}" stroke="#5a48ff" stroke-width="${p.excused?1.5:0}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${avgs.length>1?`<polyline points="${line}" fill="none" stroke="#e7c44a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}${dots}</svg>
    <div class="legend"><span><i style="background:#8f86ff"></i>Daily weight</span><span><i style="background:#e7c44a"></i>5-day average</span><span>○ excused</span></div>`;
}

const MEALS = ['Breakfast','Lunch','Dinner','Snacks'];

let fuelDate = todayISO(), sheet = null, scanStop = null, scanDone = false, zxReader = null;
const fmt0 = x => Math.round(+x||0).toLocaleString('en-US');
function defaultMeal(){ const h=new Date().getHours(); return h<11?'Breakfast':h<16?'Lunch':h<22?'Dinner':'Snacks'; }
function dayItems(d){ return (foodDays[d] && foodDays[d].items) || []; }
function totals(items){ return items.reduce((t,i)=>({kcal:t.kcal+(+i.kcal||0),p:t.p+(+i.p||0),c:t.c+(+i.c||0),f:t.f+(+i.f||0)}),{kcal:0,p:0,c:0,f:0}); }
function saveFood(date){ const doc = foodDays[date] || {date, items:[]}; foodDays[date] = doc; return writeDoc('f-'+date, doc); }
function scaleItem(per100, g){ const k=(+g||0)/100; return {kcal:Math.round(per100.kcal*k), p:Math.round(per100.p*k*10)/10, c:Math.round(per100.c*k*10)/10, f:Math.round(per100.f*k*10)/10}; }
function addItems(list){
  const d = fuelDate, doc = foodDays[d] || {date:d, items:[]};
  list.forEach(it => doc.items.push({...it, id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), t:Date.now()}));
  foodDays[d] = doc; saveFood(d); closeSheet(); if(tab!=='fuel') tab='fuel'; render();
  toast(list.length>1 ? list.length+' items added' : 'Added');
}
function recentFoods(){
  const seen = new Map();
  Object.keys(foodDays).sort().reverse().slice(0,30).forEach(d => dayItems(d).slice().reverse().forEach(i => { if(!seen.has(i.name)) seen.set(i.name, i); }));
  return [...seen.values()].slice(0,12);
}
function suggestTargets(){
  const last = weighins(todayISO()).slice(-1)[0];
  const w = avg5(todayISO()) || (last && last.weight); if(!w) return null;
  const g = profile.goal;
  const kcal = Math.round((w*30 + (g==='cut'?-400:g==='gain'?250:0))/10)*10;
  const p = Math.round(w*2), f = Math.round(w*0.8);
  const c = Math.max(0, Math.round((kcal - p*4 - f*9)/4));
  return {kcal, p, c, f};
}

function setScanStatus(t){ const s=$('#scanStatus'); if(s) s.textContent=t; }
function stopScan(){ if(scanStop){ try{ scanStop(); }catch(e){} scanStop=null; } }
function loadZXing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; sc.onload=()=>res(window.ZXing); sc.onerror=rej; document.head.appendChild(sc); });
}
async function nativeDetector(){
  if(!('BarcodeDetector' in window)) return null;
  try{ const f = await BarcodeDetector.getSupportedFormats(); if(!f.includes('ean_13')) return null;
    return new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e'].filter(x=>f.includes(x))}); }catch(e){ return null; }
}
async function openScanner(){
  sheet = {type:'barcode'}; scanDone=false; renderSheet();
  const video = $('#scanVideo');
  try{
    const det = await nativeDetector();
    if(det){
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}}, audio:false});
      if(!sheet || sheet.type!=='barcode'){ stream.getTracks().forEach(t=>t.stop()); return; }
      video.srcObject = stream; await video.play().catch(()=>{});
      let alive = true; scanStop = ()=>{ alive=false; stream.getTracks().forEach(t=>t.stop()); };
      setScanStatus('Point the camera at the barcode');
      const loop = async ()=>{ if(!alive) return; try{ const r = await det.detect(video); if(r.length){ onCode(r[0].rawValue); return; } }catch(e){} setTimeout(loop, 180); };
      loop(); return;
    }
    const Z = await loadZXing();
    if(!sheet || sheet.type!=='barcode') return;
    zxReader = new Z.BrowserMultiFormatReader();
    scanStop = ()=>{ try{ zxReader.reset(); }catch(e){} };
    setScanStatus('Point the camera at the barcode');
    await zxReader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}}, video, (res)=>{ if(res) onCode(res.getText()); });
  }catch(e){ setScanStatus('Camera not available. Type the number or scan from a photo.'); }
}
function onCode(code){ if(scanDone) return; scanDone=true; if(navigator.vibrate) try{navigator.vibrate(60);}catch(e){} stopScan(); lookup(code); }
async function scanFromPhoto(file){
  setScanStatus('Reading barcode…');
  try{
    const det = await nativeDetector();
    if(det){ const bmp = await createImageBitmap(file); const r = await det.detect(bmp); if(r.length) return onCode(r[0].rawValue); }
    else { const Z = await loadZXing(); const url = URL.createObjectURL(file); try{ const r = await new Z.BrowserMultiFormatReader().decodeFromImageUrl(url); URL.revokeObjectURL(url); return onCode(r.getText()); }catch(e){ URL.revokeObjectURL(url); } }
    setScanStatus('No barcode found in that photo. Try closer and sharper.');
  }catch(e){ setScanStatus('Could not read that photo.'); }
}
async function lookup(raw){
  const code = String(raw||'').replace(/\D/g,''); if(code.length<6){ toast('Check the barcode number'); return; }
  const mine = profile.barcodes && profile.barcodes[code];
  if(mine){ openConfirm({name:mine.name, per100:mine.per100, code, src:'barcode', serving:mine.serving||null}); return; }
  setScanStatus('Looking up '+code+'…');
  try{
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_de,product_name_en,brands,nutriments,serving_quantity`);
    const j = await r.json();
    const p = j && j.status===1 ? j.product : null, n = (p && p.nutriments) || {};
    let kcal = n['energy-kcal_100g']; if(kcal==null && n.energy_100g!=null) kcal = n.energy_100g/4.184;
    const name = p ? [p.product_name_de||p.product_name||p.product_name_en, p.brands && p.brands.split(',')[0]].filter(Boolean).join(' · ') : '';
    if(p && kcal!=null){
      const serving = Math.round(+p.serving_quantity) || null;
      openConfirm({name: name || 'Product '+code, per100:{kcal:+kcal, p:+(n.proteins_100g||0), c:+(n.carbohydrates_100g||0), f:+(n.fat_100g||0)}, grams: serving || 100, serving, code, src:'barcode'});
    } else {
      sheet = {type:'manual', code, name, meal:defaultMeal(), msg: p ? 'Found the product, but it has no nutrition data. Enter it from the label once.' : 'Not in Open Food Facts yet. Enter the values from the label once.'};
      renderSheet();
    }
  }catch(e){ scanDone=false; setScanStatus('Lookup failed. Check your connection and try again.'); }
}

/* ---------- AI photo ---------- */
async function getModel(){
  if(!fb) throw new Error('Sign-in and Firebase are needed for photo analysis.');
  if(fb.model) return fb.model;
  const aim = await import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-ai.js`);
  const ai = aim.getAI(fb.app, {backend: new aim.GoogleAIBackend()});
  fb.model = aim.getGenerativeModel(ai, {model: firebaseConfig.aiModel || 'gemini-3.5-flash', generationConfig:{responseMimeType:'application/json', temperature:0.2}});
  return fb.model;
}
async function aiPhotoChosen(file){
  try{
    const url = URL.createObjectURL(file); const img = await loadImg(url);
    sheet.full = resize(img, 1024).toDataURL('image/jpeg', 0.8);
    sheet.preview = resize(img, 640).toDataURL('image/jpeg', 0.75);
    sheet.thumb = resize(img, 160).toDataURL('image/jpeg', 0.6);
    URL.revokeObjectURL(url); sheet.state='pick'; renderSheet();
  }catch(e){ toast('Could not read that photo'); }
}
async function aiRun(){
  const h = $('#aiHint'); sheet.hint = h ? h.value.trim() : '';
  sheet.state='busy'; renderSheet();
  const prompt = `You are a careful sports nutritionist. Identify each distinct food or drink in this photo.
For each one, estimate the edible weight in grams as served and the nutrition for that weight.
Assume typical European portions; count visible oil, sauces and dressings as separate items when they add meaningful calories.
${sheet.hint ? 'The user adds: "'+sheet.hint.replace(/"/g,"'")+'". Trust this over your visual estimate.' : ''}
Answer with JSON only, in this shape:
{"items":[{"name":"English name","grams":0,"kcal":0,"protein":0,"carbs":0,"fat":0}],"confidence":"low|medium|high","note":"one short sentence about what was hard to judge"}
If there is no food in the photo, return {"items":[],"confidence":"low","note":"No food visible."}`;
  try{
    const model = await getModel();
    const res = await model.generateContent([prompt, {inlineData:{data: sheet.full.split(',')[1], mimeType:'image/jpeg'}}]);
    let txt = res.response.text().trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
    const j = JSON.parse(txt);
    sheet.items = (j.items||[]).map(i=>{ const g = Math.max(1, +i.grams||100);
      const per100 = {kcal:(+i.kcal||0)/g*100, p:(+i.protein||0)/g*100, c:(+i.carbs||0)/g*100, f:(+i.fat||0)/g*100};
      return {name:String(i.name||'Food'), grams:g, per100, ...scaleItem(per100, g), on:true}; });
    sheet.note = (j.confidence ? 'Confidence: '+j.confidence+'. ' : '') + (j.note||'');
    sheet.state = 'result';
  }catch(e){
    const m = String((e && (e.code||e.message)) || e);
    sheet.state='error';
    sheet.err = /app-check|appCheck|attestation|403|PERMISSION|API_NOT|not enabled|has not been used/i.test(m)
      ? 'Photo analysis isn\'t switched on yet in Firebase (AI Logic + App Check). The README in your repo has the 3 steps.'
      : /429|quota|RESOURCE_EXHAUSTED/i.test(m) ? 'The free AI limit is reached for now. Try again later or add it manually.'
      : 'Could not analyse the photo ('+m.slice(0,80)+').';
  }
  renderSheet();
}

function gtgHistory(){

  return gtgList().map(ex => {
    const vals = dates.map(d => gtgSets(d, ex.id).reduce((s,x)=>s+(+x.v||0),0));
    const setsN = dates.map(d => gtgSets(d, ex.id).length);
    const mx = Math.max(1, ...vals), W=300, H=70, bw=W/14;
    const bars = vals.map((v,i)=>`<rect x="${i*bw+2}" y="${H-14-(v/mx)*(H-24)}" width="${bw-4}" height="${Math.max(v?2:0,(v/mx)*(H-24))}" rx="3" fill="${dates[i]===trainDate?'#e7c44a':'#5a48ff'}"/>`).join('');
    const labels = [0,6,13].map(i=>`<text x="${i*bw+bw/2}" y="${H-2}" font-size="8" text-anchor="middle" fill="#6b6894">${esc(fmtDate(dates[i],{day:'numeric',month:'short'}))}</text>`).join('');
    const sum = vals.reduce((a,b)=>a+b,0), sn = setsN.reduce((a,b)=>a+b,0);
    return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:800"><span>${esc(ex.name)}</span><span style="font-family:Oswald;font-weight:500;color:var(--ink2)">${sn} sets · ${fmtVal(ex,sum)}</span></div>
      <svg viewBox="0 0 ${W} ${H}" class="chart">${bars}${labels}</svg></div>`;
  }).join('');
}

function stopGtgTimer(){ if(gtgTimer){ clearInterval(gtgTimer); gtgTimer=null; } if(sheet && (sheet.type==='gLog'||sheet.type==='tLog')) sheet.running=false; }
let audioCtx = null;
function beep(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.25,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.5); o.start(); o.stop(audioCtx.currentTime+.5); }catch(e){} if(navigator.vibrate) try{navigator.vibrate([120,60,120]);}catch(e){} }
function tickUI(ex){ const c=$('#gClock'); if(c) c.textContent=fmtSec(sheet.sec); const b=$('#gBar'); if(b&&ex.target) b.style.width=Math.min(100,sheet.sec/ex.target*100)+'%'; }

function trainClick(a, v){
  switch(a){
    case 'tday': { const nd = addDays(trainDate, Number(v)); if(nd>todayISO()) return true; trainDate = nd; render(); return true; }
    case 'gAdd': sheet = {type:'gEdit', isNew:true, ex:{type:'dynamic', rem:{on:false, every:60, start:'09:00', end:'20:00'}}}; renderSheet(); return true;
    case 'gEdit': { const ex = gtgList().find(e=>e.id===v); if(!ex) return true; sheet = {type:'gEdit', ex: clone(ex)}; sheet.ex.rem = sheet.ex.rem || {on:false, every:60, start:'09:00', end:'20:00'}; renderSheet(); return true; }
    case 'gType': { gReadForm(); sheet.ex.type = v; renderSheet(); return true; }
    case 'gRem': { gReadForm(); sheet.ex.rem.on = !sheet.ex.rem.on; renderSheet(); return true; }
    case 'gEvery': { gReadForm(); sheet.ex.rem.every = Number(v); renderSheet(); return true; }
    case 'gSave': {
      gReadForm(); const ex = sheet.ex; if(!ex.name){ toast('Name the exercise'); return true; }
      profile.gtg = profile.gtg || [];
      if(sheet.isNew){ ex.id = 'x'+Date.now().toString(36); profile.gtg.push(ex); }
      else profile.gtg = profile.gtg.map(e => e.id===ex.id ? ex : e);
      saveProfile(); syncGtgReminders(); closeSheet(); render(); toast('Saved'); return true; }
    case 'gDel': { if(!sheet.confirmDel){ sheet.confirmDel=true; const b=$('#sheet [data-act=gDel]'); if(b) b.textContent='Tap again to delete (logs stay)'; return true; }
      profile.gtg = gtgList().filter(e=>e.id!==sheet.ex.id); saveProfile(); syncGtgReminders(); closeSheet(); render(); toast('Deleted'); return true; }
    case 'gLog': sheet = {type:'gLog', exId:v, sec:0, running:false}; renderSheet(); return true;
    case 'gRep': { const i=$('#gRepIn'); i.value = Math.max(0, (+i.value||0) + Number(v)); sheet.reps = +i.value; return true; }
    case 'gStart': {
      const ex = gtgList().find(e=>e.id===sheet.exId); const btn = $('#gStartBtn');
      if(sheet.running){ stopGtgTimer(); btn.textContent='Resume'; btn.className='btn ind'; return true; }
      try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(e){}
      sheet.running = true; btn.textContent='Stop'; btn.className='btn red';
      const t0 = Date.now() - (sheet.sec||0)*1000; let beeped = ex.target && sheet.sec>=ex.target;
      gtgTimer = setInterval(()=>{ if(!sheet || sheet.type!=='gLog'){ stopGtgTimer(); return; }
        sheet.sec = Math.floor((Date.now()-t0)/1000); tickUI(ex);
        if(ex.target && !beeped && sheet.sec>=ex.target){ beeped=true; beep(); } }, 200);
      return true; }
    case 'gReset': stopGtgTimer(); sheet.sec=0; renderSheet(); return true;
    case 'gSaveSet': {
      const ex = gtgList().find(e=>e.id===sheet.exId); if(!ex) return true;
      let val;
      if(ex.type==='static'){ stopGtgTimer(); const m = +($('#gSecIn').value)||0; val = m || sheet.sec; }
      else val = +($('#gRepIn').value)||0;
      if(!val){ toast(ex.type==='static'?'Start the timer or enter seconds':'Enter the reps'); return true; }
      const d = trainDate, doc = gtgDays[d] || {date:d, sets:[]};
      doc.sets.push({id:'s'+Date.now().toString(36), ex:ex.id, v:val, t: d===todayISO() ? Date.now() : parse(d).getTime()+12*3600e3});
      gtgDays[d] = doc; saveGtg(d); closeSheet(); keepScroll(()=>render());
      const n = gtgSets(d, ex.id).length; toast(`Set ${n}${ex.goal?' of '+ex.goal:''} saved`); return true; }
    case 'gDelSet': { const doc = gtgDays[trainDate]; if(!doc) return true; doc.sets = doc.sets.filter(s=>s.id!==v); saveGtg(trainDate); keepScroll(()=>render()); return true; }
    case 'openFoodGuide': tab='food'; closeSheet(); render(); window.scrollTo(0,0); return true;
  }
  return false;
}

function wReadForm(){ if(!sheet || sheet.type!=='wEdit' || sheet.pick) return; const n=$('#wName'); if(n) sheet.w.name=n.value.trim();
  document.querySelectorAll('[data-w-plan]').forEach(inp=>{ const it=sheet.w.items[+inp.dataset.wPlan]; if(it) it.plan=inp.value.trim(); }); }
function tReadKg(){ const i=$('#tKgIn'); if(i){ const x=parseFloat(String(i.value).replace(',','.')); sheet.kg = isNaN(x)?null:x; } }
function tPrefill(key){
  const info = exInfo(key), last = allSets(key).slice(-1)[0];
  return {kg: last && last.kg ? last.kg : null, reps: info.mode==='hold' ? null : (last ? last.reps : null)};
}

function train2Click(a, v, el){
  switch(a){
    case 'tsec': trainSec = v; render(); window.scrollTo(0,0); return true;
    case 'accM': accMuscle = v || null; render(); window.scrollTo(0,0); return true;
    case 'tLog': {
      sheet = {type:'tLog', key:v, wid: (el && el.dataset.w) ? activeW.wid : null, sec:0, running:false, ...tPrefill(v)}; renderSheet(); return true; }
    case 'tKg': { const i=$('#tKgIn'); const x = Math.max(0, Math.round(((parseFloat(i.value)||0) + Number(v))*10)/10); i.value = x || ''; sheet.kg = x || null; return true; }
    case 'tRep': { const i=$('#tRepIn'); i.value = Math.max(0, (+i.value||0) + Number(v)); sheet.reps = +i.value; return true; }
    case 'tStart': {
      const btn = $('#tStartBtn');
      if(sheet.running){ stopGtgTimer(); sheet.running=false; btn.textContent='Resume'; btn.className='btn ind'; return true; }
      sheet.running = true; btn.textContent='Stop'; btn.className='btn red';
      const t0 = Date.now() - (sheet.sec||0)*1000;
      gtgTimer = setInterval(()=>{ if(!sheet || sheet.type!=='tLog'){ stopGtgTimer(); return; } sheet.sec = Math.floor((Date.now()-t0)/1000); const c=$('#tClock'); if(c) c.textContent = fmtSec(sheet.sec); }, 200);
      return true; }
    case 'tReset': stopGtgTimer(); sheet.running=false; sheet.sec=0; tReadKg(); renderSheet(); return true;
    case 'tSave': {
      const info = exInfo(sheet.key); tReadKg();
      const rec = {id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), ex:sheet.key, kg:sheet.kg||null, bw:!!info.bw, t:Date.now()};
      if(info.mode==='hold'){ stopGtgTimer(); sheet.running=false; const m = +($('#tSecIn').value)||0; rec.sec = m || sheet.sec; if(!rec.sec){ toast('Start the timer or enter seconds'); return true; } }
      else { rec.reps = +($('#tRepIn').value)||0; if(!rec.reps){ toast('Enter the reps'); return true; } sheet.reps = rec.reps; }
      const d = sheet.wid ? iso(new Date(activeW.start)) : trainDate;
      if(sheet.wid) rec.wid = sheet.wid;
      if(info.lift){ rec.warm = !!sheet.warm; const ri=$('#tRestIn'); const rv = ri ? parseMS(ri.value) : null; if(rv!=null) rec.rest = rv; }
      else if(sheet.wid && activeW && activeW.lastSetAt) rec.rest = Math.round((Date.now()-activeW.lastSetAt)/1000);
      if(sheet.wid && activeW){ activeW.lastSetAt = Date.now(); activeW._alarmed = false; saveActive(); }
      if(d!==todayISO() && !sheet.wid) rec.t = parse(d).getTime()+12*3600e3;
      const doc = tDoc(d); doc.sets = (doc.sets||[]).concat([rec]); tDays[d] = doc; saveT(d);
      sheet.sec = 0; if(info.lift){ closeSheet(); keepScroll(()=>render()); toast((rec.warm?'Warm-up':'Work set')+' saved · rest timer running'); return true; }
      renderSheet(); keepScroll(()=>render());
      toast(`Set ${(doc.sets.filter(s=>s.ex===rec.ex && (!rec.wid || s.wid===rec.wid))).length} saved`); return true; }
    case 'tDel': { const d = sheet.wid ? iso(new Date(activeW.start)) : trainDate; const doc = tDoc(d); doc.sets = (doc.sets||[]).filter(s=>s.id!==v); tDays[d]=doc; saveT(d); tReadKg(); renderSheet(); keepScroll(()=>render()); return true; }
    case 'skOpen': sheet = {type:'skOpen', id:v}; renderSheet(); return true;
    case 'skSet': { profile.skills = profile.skills || {}; profile.skills[sheet.id] = {cur:+v, since: todayISO()}; saveProfile(); renderSheet(); keepScroll(()=>render()); return true; }
    case 'skDel': { if(!sheet.confirmDel){ sheet.confirmDel = true; renderSheet(); return true; }
      profile.skillsCustom = (profile.skillsCustom||[]).filter(s=>s.id!==sheet.id); if(profile.skills) delete profile.skills[sheet.id]; saveProfile(); closeSheet(); render(); return true; }
    case 'skNew': sheet = {type:'skNew'}; renderSheet(); return true;
    case 'skSave': {
      const name = ($('#skName').value||'').trim(); const lines = ($('#skSteps').value||'').split('\n').map(x=>x.trim()).filter(Boolean);
      if(!name || !lines.length){ toast('Add a name and at least one step'); return true; }
      const steps = lines.map(l => /\(reps\)\s*$/i.test(l) ? [l.replace(/\(reps\)\s*$/i,'').trim(),'reps'] : [l,'hold']);
      profile.skillsCustom = (profile.skillsCustom||[]).concat([{id:'c'+Date.now().toString(36), name, steps, custom:true}]);
      saveProfile(); closeSheet(); render(); toast('Skill added'); return true; }
    case 'accNew': sheet = {type:'accNew', mode:'reps', bw:false}; renderSheet(); return true;
    case 'anMode': { const n=$('#anName'); sheet.name = n?n.value:''; sheet.mode = v; renderSheet(); if(sheet.name) $('#anName').value = sheet.name; return true; }
    case 'anBw': { const n=$('#anName'); sheet.name = n?n.value:''; sheet.bw = !sheet.bw; renderSheet(); if(sheet.name) $('#anName').value = sheet.name; return true; }
    case 'anSave': {
      const name = ($('#anName').value||'').trim(); if(!name){ toast('Name the exercise'); return true; }
      const key = 'a:c-'+slug(name)+'-'+Date.now().toString(36).slice(-4);
      profile.accCustom = (profile.accCustom||[]).concat([{key, name, mode:sheet.mode, bw:sheet.bw, muscle:accMuscle}]);
      saveProfile(); closeSheet(); render(); toast('Exercise added'); return true; }
    case 'wNew': sheet = {type:'wEdit', isNew:true, w:{name:'', items:[]}}; renderSheet(); return true;
    case 'wEdit': { const w = workoutsList().find(x=>x.id===v); if(!w) return true; sheet = {type:'wEdit', w: clone(w)}; renderSheet(); return true; }
    case 'wPick': wReadForm(); sheet.pick = v || null; renderSheet(); $('#sheet .panel').scrollTop = 0; return true;
    case 'wAdd': sheet.w.items = (sheet.w.items||[]).concat([{key:v, plan:''}]); sheet.pick = null; renderSheet(); toast('Added'); return true;
    case 'wUp': case 'wDown': { wReadForm(); const i=+v, j = a==='wUp'?i-1:i+1, it = sheet.w.items; if(j<0||j>=it.length) return true; [it[i],it[j]]=[it[j],it[i]]; renderSheet(); return true; }
    case 'wRm': wReadForm(); sheet.w.items.splice(+v,1); renderSheet(); return true;
    case 'wSave': { wReadForm(); const w = sheet.w; if(!w.name){ toast('Name the workout'); return true; } if(!w.items.length){ toast('Add at least one exercise'); return true; }
      profile.workouts = profile.workouts || [];
      if(sheet.isNew){ w.id = 'w'+Date.now().toString(36); profile.workouts.push(w); } else profile.workouts = profile.workouts.map(x=>x.id===w.id?w:x);
      saveProfile(); closeSheet(); render(); toast('Workout saved'); return true; }
    case 'wDel': { if(!sheet.confirmDel){ sheet.confirmDel=true; renderSheet(); return true; }
      profile.workouts = workoutsList().filter(x=>x.id!==sheet.w.id); saveProfile(); closeSheet(); render(); return true; }
    case 'wStart': { const w = workoutsList().find(x=>x.id===v); if(!w || activeW) return true;
      activeW = {wid:'s'+Date.now().toString(36), kind:'workout', workoutId:w.id, name:w.name, start:Date.now(), lastSetAt:null};
      try{ localStorage.setItem('mm_activeW', JSON.stringify(activeW)); }catch(e){}
      render(); window.scrollTo(0,0); toast('Workout started'); return true; }
    case 'wFinish': case 'wCancel': {
      if(!activeW) return true;
      const d = iso(new Date(activeW.start)), doc = tDoc(d);
      const n = (doc.sets||[]).filter(s=>s.wid===activeW.wid).length;
      if(a==='wFinish'){
        if(!n){ toast('Log at least one set, or discard'); return true; }
        doc.sessions = (doc.sessions||[]).concat([{wid:activeW.wid, kind:activeW.kind||'workout', skillId:activeW.skillId||null, workoutId:activeW.workoutId||null, name:activeW.name, start:activeW.start, end:Date.now(), sets:n}]);
        tDays[d] = doc; saveT(d); toast('Session saved · '+n+' sets');
      } else {
        if(!el.dataset.armed){ el.dataset.armed='1'; el.textContent = n ? `Tap again: delete ${n} sets` : 'Tap again to discard'; return true; }
        doc.sets = (doc.sets||[]).filter(s=>s.wid!==activeW.wid); tDays[d]=doc; saveT(d); toast('Workout discarded');
      }
      activeW = null; try{ localStorage.removeItem('mm_activeW'); }catch(e){}
      render(); return true; }
  }
  return false;
}
/* ============ train: streetlift + skill sessions ============ */
const LIFTS = [['l:pull','Weighted pull-up',true],['l:dip','Weighted dip',true],['l:squat','Squat',false]];
const fmtMS = s => { s = Math.max(0, Math.round(+s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const parseMS = t => { t = String(t||'').trim(); if(!t) return null; if(t.includes(':')){ const [m,s] = t.split(':').map(Number); return (m||0)*60+(s||0); } return Math.round(+t*60) || null; };
function bodyweight(){ const w = weighins(todayISO()).slice(-1)[0]; return w ? w.weight : null; }
function e1rm(load, reps){ if(!load || !reps) return null; return reps===1 ? load : load*(1+reps/30); }
function liftE1(set, bwKg){ const bw = set.ex!=='l:squat'; const load = (bw ? (bwKg||0) : 0) + (set.kg||0); const e = e1rm(load, set.reps); return e==null ? null : e - (bw ? (bwKg||0) : 0); }
function saveActive(){ try{ localStorage.setItem('mm_activeW', JSON.stringify(activeW)); }catch(e){} }
function sessionSets(){ if(!activeW) return []; return (tDoc(iso(new Date(activeW.start))).sets||[]).filter(s=>s.wid===activeW.wid); }
const isLightDay = d => parse(d).getDay()===3;  // Wednesday = light session
function liftSessions(){ return Object.keys(tDays).sort().flatMap(d => (tDays[d].sessions||[]).filter(s=>s.kind==='lift').map(s=>({...s, date:d, light:isLightDay(d)}))); }
function topWork(sets){ const w = sets.filter(s=>!s.warm); if(!w.length) return null; return w.reduce((b,s)=> (s.kg||0)>(b.kg||0) || ((s.kg||0)===(b.kg||0) && (s.reps||0)>(b.reps||0)) ? s : b); }
const kgTxt = (s, bw) => bw && !s.kg ? 'BW' : (bw ? '+' : '') + (s.kg||0) + ' kg';

function restBlock(){

const WEEKDAYS = [ // index = JS getDay()
  ['воскрес','sunday','sonntag','dimanche'],['понедель','monday','montag','lundi'],['вторник','tuesday','dienstag','mardi'],
  ['сред','wednesday','mittwoch','mercredi'],['четверг','thursday','donnerstag','jeudi'],['пятниц','friday','freitag','vendredi'],['суббот','saturday','samstag','samedi']];
function guessDate(text){
  const t = text.toLowerCase(), today = todayISO();
  const m = t.match(/(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?/);
  if(m){ const y = m[3] ? (m[3].length===2 ? 2000+ +m[3] : +m[3]) : parse(today).getFullYear(); const d = iso(new Date(y, +m[2]-1, +m[1])); if(d<=today) return d; }
  for(let wd=0; wd<7; wd++) if(WEEKDAYS[wd].some(w=>t.includes(w))){ for(let i=0;i<7;i++){ const d = addDays(today,-i); if(parse(d).getDay()===wd) return d; } }
  return addDays(today,-1);
}
function parseLiftText(text){
  const out = []; let cur = null;
  const norm = s => s.toLowerCase().replace(/[хx×*]/g,'x').replace(/кг|kgs?/g,'kg').replace(/,/g,'.').trim();
  text.split(/\n+/).forEach(raw => {
    const line = norm(raw); if(!line) return;
    if(/турник|подтяг|pull|klimm/.test(line)) { cur = 'l:pull'; return; }
    if(/брус|отжим|dip/.test(line)) { cur = 'l:dip'; return; }
    if(/присед|squat|kniebeug/.test(line)) { cur = 'l:squat'; return; }
    if(!cur) return;
    let kg = null, sets = 1, reps = null, m;
    if((m = line.match(/^(св|bw|body|кв|собств|eigengew|гриф|bar|stange)\D*?(?:(\d+)\s*x\s*)?x?\s*(\d+)\s*$/))){
      kg = /гриф|bar|stange/.test(m[1]) ? 20 : 0; if(m[2]){ sets = +m[2]; } reps = +m[3];
    } else if((m = line.match(/^\+?(\d+(?:\.\d+)?)\s*(?:kg)?\s*(\d+)\s*x\s*(\d+)/))){ kg = +m[1]; sets = +m[2]; reps = +m[3]; }
    else if((m = line.match(/^\+?(\d+(?:\.\d+)?)\s*(?:kg)?\s*x\s*(\d+)/))){ kg = +m[1]; reps = +m[2]; }
    else return;
    if(!reps) return;
    for(let i=0;i<Math.min(sets,20);i++) out.push({ex:cur, kg, reps, warm:false});
  });
  // warm-up = every set before the first heaviest set of that lift
  LIFTS.forEach(([key]) => {
    const ls = out.filter(s=>s.ex===key); if(!ls.length) return;
    const mx = Math.max(...ls.map(s=>s.kg||0)); const first = ls.findIndex(s=>(s.kg||0)===mx);
    ls.forEach((s,i)=>{ s.warm = i<first; });
  });
  return out;
}

function loadImg(url){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; }); }
function resize(img, max, q){
  const s = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c;
}

    case 'done': {
      syncInputs(); const i = draft.done.indexOf(v); i>=0 ? draft.done.splice(i,1) : draft.done.push(v); dirty=true; keepScroll(()=>$('#view').innerHTML=viewToday()); break; }
    case 'excused': syncInputs(); draft.excused=!draft.excused; dirty=true; keepScroll(()=>$('#view').innerHTML=viewToday()); break;
    case 'save': {
      syncInputs();
      if(!draft.weight && !photoSrc(draft)){ toast('Add a weight or a photo first'); return; }
      if(draft.weight && (draft.weight<25 || draft.weight>300)){ toast('Check the weight'); return; }
      const rec = clone(draft); rec.date = viewDate; rec.savedAt = Date.now();
      Object.keys(rec.signals).forEach(k=>{ if(rec.signals[k]===null) delete rec.signals[k]; });
      days[viewDate] = rec; dirty=false; saveDay(rec); render(); window.scrollTo({top:0,behavior:'smooth'}); toast('Check-in saved'); break; }
    case 'range': range = v==='all'?'all':Number(v); render(); break;
    case 'view': { const d=days[v]; $('#viewerImg').src=photoSrc(d); $('#viewerCap').textContent=fmtDate(v,{weekday:'long',day:'numeric',month:'long'})+(d.weight?' · '+r1(d.weight)+' kg':''); $('#viewer').classList.add('show'); break; }
    case 'pick': {
      const i = picks.indexOf(v);
      if(i>=0) picks.splice(i,1); else if(picks.length<3) picks.push(v); else { toast('3 actions maximum'); return; }
      keepScroll(()=>$('#view').innerHTML=viewPlan()); break; }
    case 'addCustom': {
      const t = ($('#customIn').value||'').trim(); if(!t) return;
      profile.custom = profile.custom||[]; const id='c'+Date.now();
      profile.custom.push({id, t}); if(picks.length<3) picks.push(id);
      saveProfile(); keepScroll(()=>$('#view').innerHTML=viewPlan()); break; }
    case 'savePicks': {
      if(!picks.length){ toast('Choose at least 1 action'); return; }
      const same = JSON.stringify([...picks].sort())===JSON.stringify([...(profile.actions||[])].sort());
      if(same){ toast('No changes'); return; }
      profile.actions=[...picks]; profile.actionsSince=todayISO();
      profile.log=(profile.log||[]).concat([{date:todayISO(), actions:[...picks]}]).slice(-50);
      saveProfile(); render(); toast('Actions saved · 3-week clock started'); break; }
    case 'goal': profile.goal=v; saveProfile(); render(); break;
    case 'export': {
      const data = {profile, days:Object.fromEntries(Object.entries(days).map(([k,d])=>[k,{...d, photoData: d.photoData?'[photo]':undefined}]))};
      navigator.clipboard.writeText(JSON.stringify(data,null,1)).then(()=>toast('Copied to clipboard')).catch(()=>toast('Copy not allowed here')); break; }
    case 'reset': confirmReset=true; render(); break;
    case 'resetNo': confirmReset=false; render(); break;
    case 'resetYes': {
      const ids = Object.keys(days).map(d=>'d-'+d).concat(Object.keys(foodDays).map(d=>'f-'+d)).concat(Object.keys(gtgDays).map(d=>'g-'+d)).concat(Object.keys(tDays).map(d=>'t-'+d));
      if(mode==='db'){ ids.concat(['profile']).forEach(id=>col.doc(id).delete().catch(()=>{})); }
      profile=null; days={}; foodDays={}; gtgDays={}; tDays={}; confirmReset=false; saveLocal(); tab='today'; render(); toast('Everything deleted'); break; }
    case 'fcat': foodCat=v; foodQ=''; render(); break;
    case 'fsel': foodSel = foodSel===v?null:v; keepScroll(()=>render()); break;
    default: if(!appClick(a, v) && !trainClick(a, v) && !train2Click(a, v, el) && !liftClick(a, v, el) && !importClick(a, v)) fuelClick(a, v, el);
  }
});
document.addEventListener('change', e=>{
  if(fuelChange(e)) return;
  if(e.target.id==='photoInput'){ const f=e.target.files[0]; e.target.value=''; if(f) handlePhoto(f); }
  if(e.target.dataset.act==='cmpA'){ cmpA=e.target.value; keepScroll(()=>render()); }
  if(e.target.dataset.act==='cmpB'){ cmpB=e.target.value; keepScroll(()=>render()); }
});
document.addEventListener('input', e=>{
  if(fuelInput(e)) return;
  if(['wIn','stepsIn','noteIn'].includes(e.target.id)){ dirty=true; }
  if(e.target.id==='foodQ'){ foodQ=e.target.value; const pos=e.target.selectionStart; render(); const q=$('#foodQ'); q.focus(); q.setSelectionRange(pos,pos); }
  if(e.target.id==='gramsIn'){ grams=Math.max(0,Number(e.target.value)||0); const f=Object.values(FOODS).flat().find(x=>x[0]===foodSel); if(f) $('#calcRes').innerHTML=calcRes(f,grams/100); }
});
$('#viewer').addEventListener('click', ()=>$('#viewer').classList.remove('show'));
function syncInputs(){
  if(!draft) return;
  const w=$('#wIn'), s=$('#stepsIn'), n=$('#noteIn');
  if(w){ const x=parseFloat(String(w.value).replace(',','.')); draft.weight = isNaN(x)?null:Math.round(x*10)/10; }
  if(s) draft.steps = s.value===''?null:Math.round(Number(s.value));
  if(n) draft.note = n.value;
}
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }

/* ============ boot ============ */
loadLocal();
hashTab();
render();
connect();
</script>
</body>
</html>
